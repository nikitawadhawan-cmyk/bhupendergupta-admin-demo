    <form method="post" action="/admin/?do=password" class="card stack">
    <input type="hidden" name="csrf" value="482c440d3b80e3c8f4b861d4dfd9302b">
    <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
    <label>New password <span class="hint">(at least 8 characters)</span> <input name="new" type="password" autocomplete="new-password" required minlength="8"></label>
    <label>New password again <input name="repeat" type="password" autocomplete="new-password" required minlength="8"></label>
    <button class="btn btn-primary" type="submit">Change password</button>
  </form>
