<main class="page"><div class="dash-head">
  <div>
    <h1>My stories</h1>
    <p class="hint">0 stories on the website</p>
  </div>
  <a class="btn btn-primary btn-big" href="editor.html">✍&nbsp; Write a new story</a>
</div>


<label class="search">
  <span>Find a story</span>
  <input type="search" id="find" placeholder="Type a word from the title, e.g. Ranthambore" autocomplete="off">
</label>

<ul class="story-list" id="story-list">
  </ul>
<p class="hint" id="no-match" hidden>No story matches that word.</p>

<script>
const find = document.getElementById('find');
find.addEventListener('input', () => {
  const q = find.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('#story-list li').forEach((li) => {
    const match = !q || li.dataset.search.includes(q);
    li.hidden = !match;
    shown += match;
  });
  document.getElementById('no-match').hidden = shown > 0;
});
</script>
</main>
<script src="data.js"></script>
<script src="demo.js"></script>
</body>
